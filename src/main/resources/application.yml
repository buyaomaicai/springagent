spring:
  application:
    name: spring-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_agent}
    username: ${DB_USERNAME:spring_agent}
    password: ${DB_PASSWORD:spring_agent_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
  mvc:
    async:
      request-timeout: 10m

  servlet:
    multipart:
      # 在 MultipartFile 落盘或进入 Parser 前限制上传体积，避免超大请求消耗服务器资源。
      # Parser 内部仍保留独立的 1 MiB 限制，防止它被非 HTTP 调用方绕过。
      max-file-size: 1MB
      # multipart 请求还包含 boundary 和请求头，因此总请求上限略高于单文件上限。
      max-request-size: 2MB

  task:
    execution:
      thread-name-prefix: mvc-async-
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 100
        keep-alive: 60s
        allow-core-thread-timeout: true
      shutdown:
        await-termination: true
        await-termination-period: 30s
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.springagent.common.persistence
  configuration:
    map-underscore-to-camel-case: true

knowledge:
  chunking:
    # 分块策略：FIXED | PARAGRAPH | HEADING_AWARE
    strategy: HEADING_AWARE
    # chunk 目标大小（字符）与滑动窗口重叠量（字符，必须小于 chunk-size）
    chunk-size: 500
    overlap: 50

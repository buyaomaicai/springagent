services:
  postgres:
    image: postgres:17-alpine
    container_name: spring-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spring_agent}
      POSTGRES_USER: ${POSTGRES_USER:-spring_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spring_agent_dev}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
    name: spring-agent-postgres-data
